services:
  db:
    image: postgres:16-alpine
    container_name: fisio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fisio_db}
      POSTGRES_USER: ${POSTGRES_USER:-fisio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fisio_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fisio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: fisio_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fisio}:${POSTGRES_PASSWORD:-fisio_pass}@db:5432/${POSTGRES_DB:-fisio_db}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: fisio_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
